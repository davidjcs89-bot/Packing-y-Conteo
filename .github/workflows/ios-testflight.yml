# Compila la app de iPhone en la nube (Expo EAS) y la envía a TestFlight.
# Se ejecuta a mano desde GitHub: pestaña "Actions" → "iOS a TestFlight" → "Run workflow".
# Requiere el secreto EXPO_TOKEN (Settings → Secrets and variables → Actions).
name: iOS a TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
