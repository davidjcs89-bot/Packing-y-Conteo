  if (!sel.length){ toast('Escribe el estilo de cada fila antes de importar'); return; }
  const mon = impMon(), tc = mon === 'RMB' ? num(S.tc) : null;
  if (mon === 'RMB' && !tc){ toast('Escribe el tipo de cambio'); return; }
  const china = esChina(prov(S.importProv));
  const grupos = new Map();
  for (const c of sel){
    const est = c.estilo.trim().toUpperCase();
    const tallas = china && !c.tallaConv ? uniq(c.tallas.map(bajarTalla)) : c.tallas;
    let g = grupos.get(est);
    if (!g){ g = { est, cands:[], nombre:'', costo:null, pMen:null, pMay:null, colores:[], tallas:[], fotos:[], raws:[], cantidad:0, detalle:[], inv:false }; grupos.set(est, g); }
    g.cands.push(c);
    if (!g.nombre && c.nombre) g.nombre = c.nombre.trim();
    if (g.costo == null && c.costo != null) g.costo = c.costo;
    if (g.pMen == null && c.pMen != null) g.pMen = c.pMen;
    if (g.pMay == null && c.pMay != null) g.pMay = c.pMay;
    g.colores = uniq([...g.colores, ...c.colores]); g.tallas = uniq([...g.tallas, ...tallas]);
    for (const f of [c.foto, ...(c.mas || [])]) if (f && !g.fotos.includes(f)) g.fotos.push(f);
    if (!c.foto && c.raw) g.raws.push(c.raw);
    if (c.inv){ g.inv = true; g.cantidad += c.cantidad || 0; g.detalle.push(...(c.detalle || [])); }
  }
  let nuevos = 0, act = 0, i = 0;
  const docsImp = S.cfg.respFact !== false ? [...(S.impMode === 'pdf' || S.pdf ? (S.pdfFile ? [S.pdfFile] : []) : []), ...S.invShots.map(x => x.file).filter(Boolean)] : [];
  const metaImp = { proveedorId:S.importProv, factura:(S.importFact || '').trim(), origen:'importacion' };
  const compraItems = []; const provImp = S.importProv, facImp = (S.importFact || '').trim();
  progStart('Importando artículos', grupos.size, true);
  try {
    for (const g of grupos.values()){
      if (S.prog && S.prog.cancel) break;
      S.importing = `Importando ${++i} de ${grupos.size}…`; render();
      progStep(`Artículo ${i} de ${grupos.size}`, g.est + (g.nombre ? ' · ' + g.nombre : ''));
      for (const r of g.raws){ try { g.fotos.push(await storePhoto(r)); } catch {} }
      const orig = { moneda:mon, tc, costoOrigen:g.costo };
      const ex = S.arts.find(a => a.proveedorId === S.importProv && (a.estilo||'').toUpperCase() === g.est);
      const factK = (S.importFact || '').trim() || '·';
      const linStk = g.inv ? lineasDeDetalle(g.detalle, esChina(prov(S.importProv))) : [];
      const yaEntro = ex && (ex.stockFacturas || []).includes(factK);
      const stkExtra = false && linStk.length && !yaEntro ? { stock:aplicar(ex ? ex.stock : {}, linStk), stockFacturas:uniq([...((ex && ex.stockFacturas) || []), factK]) } : {};
      const ci = linStk.length ? { artId:null, est:g.est, lineas:linStk, costo:g.costo, g } : null; if (ci) compraItems.push(ci);
      let artIdMov = ex ? ex.id : null;
      if (ex){
        const extra = g.inv ? { cantidad: ex.factura && ex.factura === S.importFact ? g.cantidad : (ex.cantidad || 0) + g.cantidad, detalle:g.detalle } : {};
        await save('articulos', ex.id, { ...ex, costo:toUsd(g.costo) ?? ex.costo, ...orig, ...(g.pMen != null ? { pMen:g.pMen } : {}), ...(g.pMay != null ? { pMay:g.pMay } : {}),
          factura:S.importFact || ex.factura, nombre:ex.nombre || g.nombre, colores:uniq([...(ex.colores||[]), ...g.colores]), tallas:uniq([...(ex.tallas||[]), ...g.tallas]),
          fotos:uniq([...(ex.fotos||[]), ...g.fotos]), ...extra, ...stkExtra, ejemplo:false }); act++;
      } else {
        artIdMov = uid();
        await save('articulos', artIdMov, { estilo:g.est, nombre:g.nombre, categoria:'', proveedorId:S.importProv, factura:S.importFact.trim(), costo:toUsd(g.costo), ...orig,
          pMen:g.pMen, pMay:g.pMay, colores:g.colores, tallas:g.tallas, fotos:g.fotos, creado:Date.now(), ejemplo:false, ...(g.inv ? { cantidad:g.cantidad, detalle:g.detalle } : {}), ...stkExtra }); nuevos++;
      }
      if (ci) ci.artId = artIdMov;
      if (stkExtra.stock){ try { await save('movimientos', uid(), { artId:artIdMov, estilo:g.est, proveedorId:S.importProv, tipo:'entrada', lineas:linStk, total:linStk.reduce((x, l) => x + l.cant, 0), motivo:'Importación de factura', factura:S.importFact || '', at:Date.now() }); } catch {} }
      for (const c of g.cands) if (c.img && c.img.startsWith('blob:')) URL.revokeObjectURL(c.img);
      S.cands = S.cands.filter(x => !g.cands.includes(x));
      progDone();
    }
    const junt = sel.length - grupos.size;
    setTimeout(() => revisarFotos(null, true), 1500);
    if (S.stkOmitidas){ setTimeout(() => toast(`${S.stkOmitidas} ${S.stkOmitidas === 1 ? 'artículo ya tenía' : 'artículos ya tenían'} la entrada de esta factura; no se sumó otra vez`), 2600); S.stkOmitidas = 0; }
    toast(`${nuevos} nuevos${act ? ' · ' + act + ' actualizados' : ''}${junt ? ' · ' + junt + (junt === 1 ? ' fila repetida unida' : ' filas repetidas unidas') : ''}${sinEst ? ' · ' + sinEst + ' sin estilo quedan en la lista' : ''}`);
    if (compraItems.length){ try { const items = compraItems.map(x => ({ ...x, a:S.arts.find(a => a.id === x.artId) || { id:x.artId, estilo:x.est, proveedorId:provImp, colores:x.g.colores, tallas:x.g.tallas, detalle:x.g.detalle, stock:{}, costo:toUsd(x.g.costo), costoOrigen:mon === 'RMB' ? x.g.costo : null } })).filter(x => x.a && x.a.id);
        const lleg = await elegirLlegada(); if (lleg) lsSet('cat.llegada', lleg);
        const c = await compraDesdeFactura(provImp, facImp, mon, tc, items, lleg);
        if (c){ metaImp.compraId = c.id; setTimeout(() => toast(lleg === 'maleta' ? `La factura quedó En camino en tu maleta · ${compraTot(c).pzs} pzs. Ábrela en Bodega › Compras y toca Contar maleta.`
          : lleg === 'mixto' ? `La factura quedó En camino · ${compraTot(c).pzs} pzs. Abre la compra y reparte qué vino en tu maleta.` : `La factura quedó como compra En camino · ${compraTot(c).pzs} pzs. Entran a bodega al contarlas.`), 2200); } } catch (er) { toast('No se pudo crear la compra en camino: ' + (er.message || er)); } }
    if (docsImp.length && S.assets){ subirDocs(docsImp, metaImp).then(n => { if (n) toast(`Factura respaldada · ${n} ${n === 1 ? 'archivo' : 'archivos'}`); }); }
    if (!S.cands.some(c => c.inv)){ S.invShots.forEach(x => x.url && URL.revokeObjectURL(x.url)); S.invShots = []; S.invSum = null; }
  } catch (e) { toast('No se pudo importar: ' + (e.message || e.code)); }
  finally { progEnd(); S.importing = ''; if (!S.cands.some(c => c.inv)){ S.importFecha = null; S.importPagado = false; } render(); }
}

boot();
})();
</script>
