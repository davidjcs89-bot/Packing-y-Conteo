<title>Packing-y-Conteo de productos ya comprados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app móvil de una columna (máx. 480px) con barra superior y barra de pestañas inferior fijas; hojas a pantalla completa para editar, importar y recortar. */
:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --card:#FFFFFF; --ink:#15201D; --muted:#5C6A65; --line:#D3DBD8;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#D7ECE6; --gold:#9A6512; --gold-soft:#F5E7CF; --danger:#B42318; --danger-soft:#FBE4E1;
  --f-display:"Familjen Grotesk","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --top:56px; --bot:64px; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --card:#1B2521; --ink:#E5EEEA; --muted:#93A39D; --line:#2A3732;
  --accent:#43C3A2; --accent-ink:#05231C; --accent-soft:#16372F; --gold:#E3AE55; --gold-soft:#3A2D16; --danger:#F27B70; --danger-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --card:#1B2521; --ink:#E5EEEA; --muted:#93A39D; --line:#2A3732;
  --accent:#43C3A2; --accent-ink:#05231C; --accent-soft:#16372F; --gold:#E3AE55; --gold-soft:#3A2D16; --danger:#F27B70; --danger-soft:#3D1A17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Barras fijas */
.topbar,.bottombar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);z-index:200;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{top:0;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.topbar .in{height:var(--top);display:flex;align-items:center;gap:12px}
.topbar h1{font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .verweb{flex:none;font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 7px;margin-left:-6px;white-space:nowrap}
.topbar .sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent)}
.bottombar{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--line)}
.bottombar .in{height:var(--bot);display:grid;grid-template-columns:repeat(5,1fr)}
.tabbtn{font-size:11px}
.tabbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabbtn svg{width:22px;height:22px}
.tabbtn[aria-current="page"]{color:var(--accent)}

.content{max-width:480px;margin:0 auto;padding-top:var(--top);padding-bottom:var(--bot);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:16px 96px}

/* Controles */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.15fr .85fr 1fr;gap:8px}
.row3 .field>span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row3 .maskbox{padding:8px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 16px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.xlsask{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.xlsbox{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.xlsbox .btn{flex-direction:column;gap:2px;text-align:center}.xlsbox b{font-size:17px}.xlsbox p{margin:0 0 6px;font-size:13px;opacity:.75}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.may[aria-pressed="true"]{background:var(--gold);color:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.addc{min-width:44px;justify-content:center;font-size:18px;font-weight:600;color:var(--accent);border-style:dashed;padding:3px 12px}
.chip .cdot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
.hist{display:flex;flex-direction:column;gap:4px;margin-top:6px}.hist .hscroll{padding-bottom:2px}
.sh-cant{margin-left:8px;font-size:.72em;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 9px;vertical-align:middle;white-space:nowrap}.sh-cant:empty{display:none}
.sh-sub{display:flex;align-items:center;gap:6px;padding:0 16px 6px 56px;font-size:13.5px}.sh-sub .mu{color:var(--muted)}.sh-sub .sh-cant,.sh-sub .sh-cost{margin-left:0;font-size:13px}
.sh-tot{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--accent)}
.sh-cost{margin-left:6px;font-size:.72em;font-weight:700;font-family:var(--f-mono);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
.sh-est{margin-left:6px;font-size:.9em;color:var(--accent)}.sh-est:empty{display:none}
.edprecio{display:flex;flex-direction:column;gap:14px}.edprecio .section{display:flex;flex-direction:column;gap:10px}
.cpart{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.cpart-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.cpart-h select{max-width:60%}
.cfib{display:grid;grid-template-columns:1fr 92px 28px;gap:8px;align-items:center}
.cpct{position:relative;display:block}.cpct input{padding-right:26px;text-align:right}.cpct b{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:500}
.cfib .x{border:0;background:none;font-size:20px;color:var(--muted)}
.cpsum.ok{color:var(--accent);font-weight:600}.cpsum.bad{color:var(--danger);font-weight:600}
.chip.bajo{opacity:.4;text-decoration:line-through}
.ph .fsz{position:absolute;left:5px;bottom:24px;font-size:10.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);border-radius:5px;padding:1px 5px;pointer-events:none}.ph .fsz.opt{background:rgba(31,110,90,.85)}
.lb-info{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;color:#fff;font-size:12.5px;padding:4px 12px}.lb-info .lb-name{font-family:var(--f-mono);font-weight:600}.lb-info .linkbtn{color:#9fe3cc}
.mchip{gap:2px;padding:3px 8px 3px 4px}.mchip.on{background:var(--accent-soft);border-color:var(--accent)}.mstar{border:0;background:none;font-size:15px;color:var(--gold, #b8860b);padding:0 3px}
.gfill{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.gfill .chip{min-width:40px;justify-content:center;font-weight:600}
[hidden]{display:none!important}
.ordbox{position:relative;flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 8px;height:32px;color:var(--ink)}.ordbox svg{width:16px;height:16px;flex:none}.ordbox select{appearance:none;-webkit-appearance:none;border:0;background:none;color:inherit;font:inherit;font-size:16px;font-weight:600;max-width:120px;padding:0 2px;text-overflow:ellipsis}
.envdet{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:13.5px}.envrow{display:flex;justify-content:space-between;gap:10px}.envrow span{color:var(--muted)}.envrow b{font-family:var(--f-mono);font-weight:600;text-align:right}.envrow i{font-style:normal;color:var(--muted);font-weight:400;font-size:12px;margin-right:4px}.envrow.sub{border-top:1px dashed var(--line);padding-top:4px}.envrow.off b{text-decoration:line-through;color:var(--muted)}
.envrow.tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}.envrow.tot span{color:var(--ink);font-weight:700}.envrow.tot b{color:var(--accent);font-weight:700}
.kgbox{display:flex;align-items:center;color:var(--muted);background:var(--bg)}
.vj-card,.vj-prov{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--ink)}.vj-card .txt,.vj-prov>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}.vj-num{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--f-mono)}.vj-prov.on{border-color:var(--accent)}
.vj-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:relative;padding-right:34px}.vj-g .vj-m{display:grid;grid-template-columns:1fr 84px;gap:6px;grid-column:1/-1}.vj-g .x{position:absolute;top:6px;right:6px;border:0;background:none;font-size:20px;color:var(--muted)}
.filtrobar{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:8px 10px;font-size:14px}.filtrobar span{flex:1}.filtrobar .btn{padding:6px 12px}
.edtabs{display:grid;grid-template-columns:.85fr 1.3fr 1.2fr .95fr 36px;gap:4px;margin:8px 16px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.edtabs button svg{width:20px;height:20px;vertical-align:middle}
.edtabs button{border:0;background:none;border-radius:9px;padding:9px 1px;font-weight:600;font-size:12.5px;letter-spacing:-.1px;white-space:nowrap;color:var(--muted)}
.edtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.addrow{display:flex;gap:8px;margin-top:8px}.addrow .inp{flex:1}.addrow .btn{flex:none;width:auto;padding:0 16px}
.chip .x{border:0;background:none;padding:0 0 0 2px;color:var(--muted);font-size:15px;line-height:1}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.hscroll::-webkit-scrollbar{display:none}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .inp{padding-left:38px;padding-right:96px}
.estbox .inp{padding-left:12px;padding-right:58px}
.estbox .qmode{right:6px}
.search.conscan .inp{padding-right:136px}
.qscan{position:absolute;right:94px;top:50%;transform:translateY(-50%);height:30px;width:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}.qscan svg{width:19px;height:19px}
.qmode{position:absolute;right:42px;top:50%;transform:translateY(-50%);height:30px;min-width:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-family:var(--f-mono);font-size:12.5px;font-weight:700;padding:0 8px}
.search input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.qhist{display:flex;align-items:center;gap:8px;min-width:0;margin-top:-4px}
.qhist .hscroll{flex:1;min-width:0}
.qhist .chip{padding:4px 10px;font-size:12.5px}
.qhist .chip.on{border-color:var(--accent);background:var(--accent-soft)}
.qhist .linkbtn{font-size:12px;color:var(--muted)}
.qgo{display:none;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;height:40px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:15px}.qgo svg{width:18px;height:18px}
.search:focus-within:has(input:not([hidden]):not(:placeholder-shown)) + .qgo{display:flex}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}

/* Tarjetas de artículo */
.list{display:flex;flex-direction:column;gap:10px}
.art{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.thumb{width:76px;height:96px;border-radius:8px;background:var(--bg);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.art .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.art .top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.code{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.02em}
.art .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prices{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--accent-soft);font-variant-numeric:tabular-nums}
.pill.may{background:var(--gold-soft);color:var(--ink)}
.pill.warn{background:var(--danger-soft);color:var(--danger)}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:1px 6px;background:var(--gold-soft);color:var(--gold)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:18px}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.note.info{background:var(--accent-soft);border-color:transparent}
.note.err{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.section{display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-h h2{font-size:17px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}

.fab{position:fixed;z-index:150;bottom:calc(var(--bot) + 16px + env(safe-area-inset-bottom,0px));right:calc(max(0px,(100vw - 480px)/2) + 16px + env(safe-area-inset-right,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;height:52px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab svg{width:20px;height:20px}

/* Hojas a pantalla completa */
.sheet{position:fixed;inset:0;bottom:calc(var(--bot) + env(safe-area-inset-bottom,0px));z-index:300;background:var(--bg);display:flex;flex-direction:column}
.bottombar{z-index:350}
.sheet .sh-top{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet .sh-bar{max-width:480px;margin:0 auto;height:var(--top);display:flex;align-items:center;gap:10px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .sh-bar h2{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow-x:auto;scrollbar-width:none}.sheet .sh-bar h2::-webkit-scrollbar{display:none}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.sheet .sh-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.cqplus{display:block;width:100%;margin-top:4px;height:30px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;line-height:1;padding:0;touch-action:manipulation}
.cqplus.pop{animation:cqpop .25s}@keyframes cqpop{50%{transform:scale(.9)}}
.cpart.filoff{display:none}.cpart.irr{border-color:var(--gold)}.chip.wfal:not([aria-pressed="true"]){border-color:var(--danger);color:var(--danger)}.chip.wirr:not([aria-pressed="true"]){border-color:var(--gold);color:var(--gold)}.mtag.warn{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.cnt-lacc{display:flex;gap:14px;flex-wrap:wrap;align-items:center}td.xtra .inp{border-style:dashed;border-color:var(--gold)}td.xtra .cqp{color:var(--gold)}
.cnt-bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.cnt-bar span{display:block;height:100%;background:var(--accent)}
.cnt-go{display:flex;gap:8px;flex-wrap:wrap}.cnt-go .btn{flex:1}
.cnt-prog{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.cnt-it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.cnt-it summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:14px;list-style:none}.cnt-it summary::-webkit-details-marker{display:none}
.cnt-det{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:13px}.cnt-acc{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.cbusbar{display:flex;flex-direction:column;gap:8px}.cord{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cqstick{position:sticky;top:0;z-index:20;background:var(--bg);margin:-16px -16px 0;padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 10px -10px rgba(0,0,0,.35)}
.sheet .sh-inner{max-width:480px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

function moneyTok(t){
  let s = t.replace(/^(US\$|USD|\$|¥|RMB)/i, '').replace(/(USD|\$)$/i, '');
  if (!/^\d{1,3}(,\d{3})*(\.\d{1,2})?$|^\d+([.,]\d{1,2})$/.test(s)) return null;

        <input class="inp" id="cl-${c.key}" data-cand="${c.key}" data-k="colores" value="${esc(c.colores.join(', '))}" placeholder="Colores">

        </div>

}

    const calc = t => { const f = factorDe(p, t); return f && cb(a) != null ? Math.ceil(r2(cb(a) * f)) : null; };
    const pb = (t, k, lbl) => { const man = a[k] != null && a[k] !== ''; const f = factorDe(p, t); return `<div class="pb ${t === 'mayoreo' ? 'may' : ''}">
      <span class="label">${lbl}</span>
      <input class="inp mono" id="e-${k}" data-e="${k}" value="${man ? a[k] : (calc(t) ?? '')}" inputmode="decimal" placeholder="0.00">
      ${(() => { const ratio = man && cb(a) ? Math.round(a[k] / cb(a) * 100) / 100 : null; const enLista = ratio != null && multsDe(t === 'mayoreo' ? 'ed' : 'edm').some(m => Math.ceil(r2(cb(a) * m)) === +a[k]);
        const txt = man ? (calc(t) != null ? `Editado · el proveedor daría ${money(calc(t))}` : enLista ? `Costo ${money(cb(a))} × ${fmtF(multsDe(t === 'mayoreo' ? 'ed' : 'edm').find(m => Math.ceil(r2(cb(a) * m)) === +a[k]))}` : 'Precio escrito a mano') : f ? `Calculado con factor ${f}` : cb(a) != null ? 'Toca un múltiplo o escribe el precio' : 'Escribe el costo para usar los múltiplos';
        return `<span class="how">${txt}</span>`; })()}
      ${multChips(t === 'mayoreo' ? 'ed' : 'edm', '', man ? (cb(a) ? (() => { const L = multsDe(t === 'mayoreo' ? 'ed' : 'edm'); const hit = L.find(m => Math.ceil(r2(cb(a) * m)) === +a[k]); return hit ?? a[k] / cb(a); })() : null) : f, cb(a))}
      ${man && calc(t) != null ? `<button class="linkbtn" data-pman="${k}">Usar el del proveedor</button>` : ''}</div>`; };
    return `<div class="sheet" role="dialog" aria-label="Artículo"><div class="sh-top"><div class="sh-bar"><button class="iconbtn" data-act="close" aria-label="Volver">${I.back}</button><h2>${s.isNew ? 'Nuevo artículo' : 'Artículo'} <span class="code sh-est" id="sh-est">${esc(a.estilo || '')}</span></h2></div>
        <div class="sh-sub"><span class="sh-cant" id="sh-cant">${cantCab(s)}</span><span class="mu">×</span><span class="sh-cost" id="sh-cost">${costoCab(a)}</span><span class="mu">=</span><span class="sh-tot" id="sh-tot">${totCab(s)}</span></div>

      <div class="sh-body"><div class="sh-inner">
        ${s.tab === 'compra' ? vCompraArt(s.a) : s.tab === 'comp' ? vComp(s) : s.tab === 'config' ? vCfgArt() : s.tab === 'precio' ? `<div class="edprecio">
        ${(() => {
          const rev = S.reveal.has('ed') || s.isNew;
          const show = (v, mon) => v == null ? '—' : verCosto() ? fmtCosto(v, mon) : '••••';
          const box = (inp, v, mon) => rev ? inp : `<div class="maskbox"><span class="mono">${show(v, mon)}</span><button class="linkbtn" data-reveal="ed">${v == null ? 'Escribir' : verCosto() ? 'Editar' : 'Ver'}</button></div>`;
          const tcV = a.tc ?? (num(S.tc) || '');
          return `<div class="row3">
              <div class="field"><span>Costo en ¥ (RMB)</span>${box(`<input class="inp mono" id="e-corig" data-e="costoOrigen" value="${a.moneda === 'RMB' ? (a.costoOrigen ?? '') : ''}" inputmode="decimal" placeholder="0.00">`, a.moneda === 'RMB' ? a.costoOrigen : null, 'RMB')}</div>

              <div class="field"><span>Costo en USD</span>${box(`<input class="inp mono" id="e-costo" data-e="costo" value="${a.costo ?? ''}" inputmode="decimal" placeholder="0.00">`, a.costo, 'USD')}</div>
            </div>

`;
        })()}
        ${vEnvio(a)}
        <div class="section"><span class="label">Precio de venta</span>
        <div class="pricebox one">${pb('mayoreo','pMay','Mayoreo')}${pb('menudeo','pMen','Menudeo')}</div>
        ${vHistCompras(a)}
        ${(() => { const pm = precio(a, 'mayoreo'), pn = precio(a, 'menudeo'); return pm != null && pn != null && pn <= pm ? `<div class="note err small">El menudeo (${money(pn)}) debe ser mayor que el mayoreo (${money(pm)}). Mayoreo es para clientes que revenden; menudeo para el consumidor final.</div>` : ''; })()}
        ${!verMen() ? '<div class="small muted">El precio de menudeo no sale en el catálogo (actívalo en Configuración si lo necesitas).</div>' : ''}</div>
        </div>` : `

/* ---------- progreso ---------- */
let progT = null;
function progStart(titulo, total, exact){ S.prog = { titulo, total:Math.max(1, total), done:0, t0:Date.now(), ts:Date.now(), filas:0, step:'', phase:'Preparando…', exact:!!exact, cancel:false, ctrl:new AbortController() }; render(); clearInterval(progT); progT = setInterval(progPaint, 400); }
function progStep(step, phase){ const p = S.prog; if (!p) return; p.step = step; p.phase = phase || ''; p.ts = Date.now(); p.filas = 0; progPaint(); }
function progPhase(phase){ if (S.prog){ S.prog.phase = phase; progPaint(); } }
function progDone(){ if (S.prog){ S.prog.done++; S.prog.ts = Date.now(); S.prog.filas = 0; progPaint(); } }
function progEnd(){ clearInterval(progT); progT = null; S.prog = null; render(); }
function progPct(){
  const p = S.prog; if (p.done >= p.total) return 100;
  let inner = 0;
  if (!p.exact){ const el = (Date.now() - p.ts) / 1000; inner = Math.min(.9, 1 - Math.exp(-el / 20)); if (p.filas) inner = Math.max(inner, Math.min(.95, .55 + p.filas * .03)); }
  return Math.min(99, Math.floor((p.done + inner) / p.total * 100));
}
function progPaint(){
  const p = S.prog; if (!p) return; const pct = progPct();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('pg-pct', pct + '%'); const b = document.getElementById('pg-bar'); if (b) b.style.width = pct + '%';
  set('pg-step', p.step); set('pg-phase', p.filas ? `${p.phase} · ${p.filas} ${p.filas === 1 ? 'fila encontrada' : 'filas encontradas'}` : p.phase);
  const s = Math.round((Date.now() - p.t0) / 1000); set('pg-time', `Tiempo: ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
}
const contarFilas = txt => (String(txt).match(/"estilo"\s*:/g) || []).length;

/* ---------- visor ---------- */
function openLb(ref, start){
  const [k, id] = ref.split(/:(.*)/s); let fotos = [], titulo = '', i = 0;
  S.lbRefs = null;
  if (k === 'art'){ const a = S.arts.find(x => x.id === id); if (!a) return; fotos = (a.fotos || []).map(fotoUrl); S.lbRefs = { refs:(a.fotos || []).slice(), a }; titulo = [a.estilo, a.nombre].filter(Boolean).join(' · '); }
  else if (k === 'ed'){ const a = S.sheet.a; fotos = a.fotos.map(fotoUrl); i = +id; titulo = a.estilo || ''; S.lbRefs = { refs:a.fotos.slice(), a }; }
  else if (k === 'cand'){ const c = S.cands.find(x => x.key === id); if (!c) return; fotos = [c.foto ? fotoUrl(c.foto) : c.img, ...(c.mas || []).map(fotoUrl)].filter(Boolean); titulo = c.estilo || ''; }
  if (!fotos.length) return;
  if (start != null && k === 'art') i = Math.min(start, fotos.length - 1);
  S.lb = { fotos, i, titulo, z:false }; render();
}
function bindLb(){
  const box = $('#lbimg'); if (!box) return; let x0 = null, moved = false;
  let y0 = null;
  box.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; moved = false; });
  box.addEventListener('pointermove', e => { if (x0 != null && (Math.abs(e.clientX - x0) > 12 || Math.abs(e.clientY - y0) > 12)) moved = true; });
  box.addEventListener('scroll', () => { moved = true; });
  box.addEventListener('pointerup', e => {
    if (S.lb.z){ if (!moved){ S.lb.z = false; render(); } x0 = null; return; }
    const dx = x0 == null ? 0 : e.clientX - x0; x0 = null;
    if (moved && Math.abs(dx) > 50){ const n = S.lb.i + (dx < 0 ? 1 : -1); if (n >= 0 && n < S.lb.fotos.length){ S.lb.i = n; render(); } return; }
    if (!moved){ S.lb.z = true; render(); const b = $('#lbimg'); if (b){ b.scrollLeft = (b.scrollWidth - b.clientWidth) / 2; b.scrollTop = (b.scrollHeight - b.clientHeight) / 3; } }
  });
}

/* ---------- recorte ---------- */
let cropState = null;
async function drawCrop(){
  const cv = $('#cropcv'); if (!cv || cv.dataset.done) return;
  cv.dataset.done = '1';
  const wrap = $('#cropwrap');
  let draw;
  if (S.sheet.imgSrc){
    const src = S.sheet.imgSrc; let im = src;
    if (src instanceof Blob){ const u = URL.createObjectURL(src); im = await loadImg(u); URL.revokeObjectURL(u); }
    else if (typeof src === 'string') im = await loadImg(src);
    const c2 = toCanvas(im, 1800); cv.width = c2.width; cv.height = c2.height; draw = () => cv.getContext('2d').drawImage(c2, 0, 0);
  } else {
    const page = await S.pdf.getPage(S.sheet.page); const vp0 = page.getViewport({ scale:1 });
    const vp = page.getViewport({ scale:1600 / vp0.width }); cv.width = vp.width; cv.height = vp.height;
    draw = () => page.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise;
  }
  const avail = window.innerHeight - 200;
  wrap.style.width = Math.min(wrap.parentElement.clientWidth, avail * cv.width / cv.height) + 'px';
  await draw();
  cropState = null;
  const box = $('#selbox');
  const pt = e => { const r = cv.getBoundingClientRect(); return { x:Math.max(0, Math.min(r.width, e.clientX - r.left)), y:Math.max(0, Math.min(r.height, e.clientY - r.top)), r }; };
  let start = null;
  wrap.addEventListener('pointerdown', e => { wrap.setPointerCapture(e.pointerId); start = pt(e); cropState = null; box.hidden = false; Object.assign(box.style, { left:start.x+'px', top:start.y+'px', width:'0px', height:'0px' }); $('#cropok').disabled = true; });
  wrap.addEventListener('pointermove', e => { if (!start) return; const p = pt(e); const x = Math.min(start.x, p.x), y = Math.min(start.y, p.y), w = Math.abs(p.x - start.x), h = Math.abs(p.y - start.y);
    Object.assign(box.style, { left:x+'px', top:y+'px', width:w+'px', height:h+'px' }); cropState = { x, y, w, h, rw:p.r.width }; });
  const end = () => { start = null; if (cropState && cropState.w > 12 && cropState.h > 12) $('#cropok').disabled = false; else { box.hidden = true; cropState = null; } };
  wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
}
async function cropOk(){
  const cv = $('#cropcv'); if (!cropState || !cv) return;
  const k = cv.width / cropState.rw;
  const out = document.createElement('canvas'); out.width = Math.round(cropState.w * k); out.height = Math.round(cropState.h * k);
  out.getContext('2d').drawImage(cv, cropState.x*k, cropState.y*k, out.width, out.height, 0, 0, out.width, out.height);
  const cb = S.sheet.onDone; const back = S.sheet.back; S.sheet = back || null; render();
  await cb(out);
}
function openCrop(onDone, page){ S.sheet = { kind:'crop', page:page || (S.pdf && S.pdf.numPages === 1 ? 1 : null), onDone, back:S.sheet }; render(); }

async function syncEstilos(){
  if (!S.ready && S.mode === 'db') return;
  const est = new Map(S.arts.filter(a => a.estilo).map(a => [a.id, a.estilo])); let n = 0;
  for (const c0 of S.compras || []){ let cambio = false; const c = JSON.parse(JSON.stringify(c0));
    for (const l of c.lineas || []){ const e = est.get(l.artId); if (e && l.estilo !== e){ l.estilo = e; cambio = true; } }
    for (const k of ['conteos']) for (const x of c[k] || []) for (const it of x.items || []){ const e = est.get(it.artId); if (e && it.estilo !== e){ it.estilo = e; cambio = true; } }
    for (const x of c.cambios || []){ const e = est.get(x.artId); if (e && x.estilo !== e){ x.estilo = e; cambio = true; } }
    if (cambio){ await save('compras', c.id, c); if (S.mode !== 'db') Object.assign(c0, c); n++;
      if (S.sheet && S.sheet.kind === 'compra' && S.sheet.c.id === c.id){ (S.sheet.c.lineas || []).forEach(l => { const e = est.get(l.artId); if (e) l.estilo = e; }); } } }
  if (n) render();
  return n;
}

const CATS_GASTO = [['pasajes', 'Pasajes'], ['hospedaje', 'Hospedaje'], ['comida', 'Comida'], ['movilizacion', 'Movilización'], ['otros', 'Otros']];
const gastoUsd = (g, v) => { const m = +g.monto || 0; if (g.moneda === 'RMB'){ const tc = +g.tc || +v.tc || num(S.tc) || 0; return tc ? m / tc : 0; } return m; };
const piezasArt = a => +a.cantidad || totalStock(a) || 1;
function viajeResumen(v){
  const arts = S.arts.filter(a => a.viajeId === v.id && !a.ejemplo);
  const gastos = (v.gastos || []).reduce((x, g) => x + gastoUsd(g, v), 0);
  const valor = arts.reduce((x, a) => x + (+a.costo || 0) * piezasArt(a), 0);
  const piezas = arts.reduce((x, a) => x + piezasArt(a), 0);
  const pct = valor ? gastos / valor * 100 : 0; const porPieza = piezas ? gastos / piezas : 0;
  const porCat = Object.fromEntries(CATS_GASTO.map(([k]) => [k, (v.gastos || []).filter(g => (g.cat || 'otros') === k).reduce((x, g) => x + gastoUsd(g, v), 0)]));
  return { arts, gastos:r2c(gastos), valor:r2c(valor), piezas, pct, porPieza, porCat };
}
function viajeCargo(a){
  if (!a.viajeId || a.costo == null) return null; const v = (S.viajes || []).find(x => x.id === a.viajeId); if (!v) return null;
  const r = viajeResumen(v); if (!r.gastos) return null;
  if (v.reparto === 'pieza') return { v, monto:r2c(r.porPieza), txt:`${money(r.gastos)} ÷ ${r.piezas} pzs` };
  return { v, monto:r2c(+a.costo * r.pct / 100), txt:`${r.pct.toFixed(1)}% del costo` };
}

/* ---------- Escanear: código de barras / QR / leer texto de etiqueta ---------- */
let scanTarget = 'q';
async function decodificarCodigo(cv){
  try { if ('BarcodeDetector' in window){ const det = new BarcodeDetector(); const r = await det.detect(cv); if (r && r[0] && r[0].rawValue) return r[0].rawValue; } } catch {}
  try {
    if (!window.ZXing) await cargarScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
    const Z = window.ZXing; const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const leer = c => { try { const rd = new Z.MultiFormatReader(); rd.setHints(hints); return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText(); } catch { return null; } };
    let t = leer(cv); if (t) return t;
    const r = document.createElement('canvas'); r.width = cv.height; r.height = cv.width; const g = r.getContext('2d'); g.translate(r.width / 2, r.height / 2); g.rotate(Math.PI / 2); g.drawImage(cv, -cv.width / 2, -cv.height / 2);
    t = leer(r); if (t) return t;
  } catch {}
  return null;
}
function buscarCon(v, how){
  v = String(v || '').trim(); if (!v) return;
  const t = scanTarget; const vv = v.toUpperCase().replace(/\s+/g, '');
  const exacto = S.arts.find(a => String(a.estilo || '').toUpperCase() === vv);
  const dentro = !exacto && S.arts.filter(a => a.estilo && vv.includes(String(a.estilo).toUpperCase())).sort((x, y) => String(y.estilo).length - String(x.estilo).length)[0];
  const q = exacto ? exacto.estilo : dentro ? dentro.estilo : v;
  if (t === 'cq' && S.sheet && (S.sheet.kind === 'compra' || S.sheet.kind === 'conteoEq')){ S.sheet.cqq = q; if (S.sheet.kind === 'compra') S.sheet.ctab = 'arts'; guardarBusqueda(q); render(); toast(`${how}: ${v}${(exacto || dentro) ? '' : ' · sin coincidencia exacta'}`); return; }
  if (t === 'bq') S.bq = q; else S.q = q;
  guardarBusqueda(q); render();
  toast(`${how}: ${v}${(exacto || dentro) ? '' : ' · sin coincidencia exacta'}`);
}
/* ---------- Cámara en vivo: código de barras / QR y texto sin tomar foto ----------
   Busca códigos continuamente; el lector de texto (Tesseract, en el teléfono) marca los
   códigos que ve: los estilos que existen se eligen solos y cualquier texto se puede tocar. */
const TESS = { js:'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js', worker:'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js',
  core:'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0', lang:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int' };
let LV = null, tessW = null, tessCargando = null;
function lectorTexto(){
  if (tessW) return Promise.resolve(tessW);
  if (!tessCargando) tessCargando = (async () => { await cargarScript(TESS.js);
    const w = await Tesseract.createWorker('eng', 1, { workerPath:TESS.worker, corePath:TESS.core, langPath:TESS.lang });
    await w.setParameters({ tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-/#. ', tessedit_pageseg_mode:'11' });
    tessW = w; return w; })().catch(e => { tessCargando = null; throw e; });
  return tessCargando;
}
const estilosSet = () => { const st = new Set(S.arts.map(a => String(a.estilo || '').toUpperCase()).filter(Boolean)); return st; };
const pareceCodigo = w => w.length >= 3 && w.length <= 20 && /\d/.test(w);
function palabrasOcr(data){ const out = [];
  (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(w => { const t = String(w.text || '').trim().replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
    if (t && (w.confidence > 40 || !w.confidence)) out.push({ t:t.toUpperCase(), b:w.bbox, c:w.confidence }); }))));
  // Si el estilo quedó pegado a otra palabra ("STYLE2536"), se separa el estilo que existe
  const est = estilosSet();
  out.forEach(w => { if (!est.has(w.t)){ const hit = [...est].filter(e => e.length >= 3 && w.t.includes(e)).sort((a, b) => b.length - a.length)[0]; if (hit) w.t = hit; } });
  return out; }
function avisoSinVivo(){ if (!lsGet('cat.avisoVivo', false)){ lsSet('cat.avisoVivo', true); toast('Esta vista no permite la cámara en vivo: toma la foto y después toca el código en la foto'); } }

async function abrirVivo(){

    <div class="lv-top"><button class="lv-x" data-lv="x" aria-label="Cerrar">×</button><span class="lv-msg">Código de barras, QR o texto de la etiqueta: se lee solo</span></div>
    <div class="lv-bot"><span class="lv-st">Abriendo la cámara…</span><div class="lv-btns"><button class="btn" data-lv="foto">Tomar foto</button></div><span class="lv-tip">También puedes tocar el texto que quieres traer</span></div>`;
  document.body.appendChild(ov);
  const video = ov.querySelector('video'); LV = { ov, video, stream:null, t1:null, ocrBusy:false, vistos:new Map(), cerrado:false };
  const st = m => { const e = ov.querySelector('.lv-st'); if (e) e.textContent = m; };
  ov.addEventListener('click', async e => { e.stopPropagation();
    const b = e.target.closest('[data-lv]'); if (b){ const a = b.dataset.lv;
      if (a === 'x') cerrarVivo(); else if (a === 'foto'){ cerrarVivo(); $('#inScan').click(); } else if (a === 'pick'){ const v = b.dataset.v; cerrarVivo(); buscarCon(v, 'Texto leído'); } return; }
    if (e.target === video || e.target.classList.contains('lv-boxes') || e.target.classList.contains('lv-guia')) await tocarTexto(e.clientX, e.clientY); });
  try { LV.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false }); }
  catch (e) { cerrarVivo(); avisoSinVivo(); $('#inScan').click(); return; }
  if (!LV || LV.cerrado){ LV && LV.stream && LV.stream.getTracks().forEach(t => t.stop()); return; }
  video.srcObject = LV.stream; try { await video.play(); } catch {}
  st('Buscando código…');
  lectorTexto().then(() => { if (LV) st('Buscando código o texto…'); }).catch(() => { if (LV) st(S.sample ? 'Buscando código… Toca el texto para leerlo con IA' : 'Buscando código de barras o QR…'); });
  const bucle = async () => { if (!LV || LV.cerrado) return;
    try { if (video.videoWidth){ const cv = cuadro(960);
        const cod = await decodificarCodigo(cv);

        if (tessW && !LV.ocrBusy) ocrCuadro(recorteGuia()); } } catch {}
    if (LV && !LV.cerrado) LV.t1 = setTimeout(bucle, 450); };

// La zona del recuadro guía, recortada del video en resolución real
function recorteGuia(){ const v = LV.video, g = LV.ov.querySelector('.lv-guia').getBoundingClientRect(), r = v.getBoundingClientRect(), m = mapaVideo();
  const x0 = Math.max(0, (g.left - r.left - m.ox) / m.k), y0 = Math.max(0, (g.top - r.top - m.oy) / m.k);
  const w = Math.min(v.videoWidth - x0, g.width / m.k), h = Math.min(v.videoHeight - y0, g.height / m.k);
  const sc = Math.min(1, 1400 / w); const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  cv.getContext('2d').drawImage(v, x0, y0, w, h, 0, 0, cv.width, cv.height); cv._k = sc; cv._x0 = x0; cv._y0 = y0; return cv; }
// Estilos preferidos: en un conteo o compra, los de esa compra
function estilosFoco(){ const sh = S.sheet; let cs = [];
  if (sh && sh.kind === 'compra') cs = [sh.c]; else if (sh && sh.kind === 'conteoEq') cs = comprasCamino().filter(c => sh.compraId ? c.id === sh.compraId : (c.viajeId || '') === sh.vid);
  return new Set(cs.flatMap(c => (c.lineas || []).map(l => String(l.estilo || '').toUpperCase())).filter(Boolean)); }
function cuadro(max){ const v = LV.video; const k = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight)); const cv = document.createElement('canvas');
  cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k); cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height); cv._k = k; return cv; }
// Coordenadas: del video (píxeles reales) a la pantalla, con object-fit: cover
function mapaVideo(){ const v = LV.video, W = v.clientWidth, H = v.clientHeight, vw = v.videoWidth, vh = v.videoHeight; const k = LV.foto ? Math.min(W / vw, H / vh) : Math.max(W / vw, H / vh);
  return { k, ox:(W - vw * k) / 2, oy:(H - vh * k) / 2 }; }
async function ocrCuadro(cv){
  LV.ocrBusy = true;
  try { const { data } = await tessW.recognize(cv, {}, { blocks:true, text:true }); if (!LV || LV.cerrado) return;
    const ws = palabrasOcr(data).filter(w => pareceCodigo(w.t)); const est = estilosSet(), foco = estilosFoco(); const m = mapaVideo();
    const lee = LV.ov.querySelector('.lv-lee');
    // 1) Un estilo de esta compra (o que existe) dentro del recuadro: se elige al verlo 2 veces seguidas
    // 2) Otro código: se elige si se lee igual 3 veces seguidas
    const conocido = ws.find(w => foco.has(w.t)) || ws.find(w => est.has(w.t));
    const mejor = conocido || ws.slice().sort((a, b) => (b.c || 0) - (a.c || 0) || (b.b.x1 - b.b.x0) - (a.b.x1 - a.b.x0))[0];
    if (lee) lee.textContent = mejor ? 'Leyendo: ' + mejor.t : '';
    if (LV.foto){ const f = ws.filter(w => foco.has(w.t)); const u = uniq(f.map(w => w.t)); if (u.length === 1){ const v = u[0]; cerrarVivo(); buscarCon(v, 'Texto detectado'); return; } }
    else if (mejor){ const n = LV.ult === mejor.t ? (LV.nUlt || 0) + 1 : 1; LV.ult = mejor.t; LV.nUlt = n;
      if (n >= (conocido ? 2 : 3)){ const v = mejor.t; cerrarVivo(); buscarCon(v, 'Texto detectado'); return; } }
    else { LV.ult = null; LV.nUlt = 0; }
    const box = LV.ov.querySelector('.lv-boxes'); const inv = 1 / cv._k;
    box.innerHTML = ws.slice(0, 8).map(w => { const x = (cv._x0 + w.b.x0 * inv) * m.k + m.ox, y = (cv._y0 + w.b.y0 * inv) * m.k + m.oy, ww = (w.b.x1 - w.b.x0) * inv * m.k, hh = (w.b.y1 - w.b.y0) * inv * m.k;
      return `<button class="lv-w ${est.has(w.t) ? 'ok' : ''}" data-lv="pick" data-v="${esc(w.t)}" style="left:${x - 4}px;top:${y - 4}px;width:${ww + 8}px;height:${hh + 8}px"><span>${esc(w.t)}</span></button>`; }).join('');

// Tocar un texto en la cámara: se lee solo esa zona
async function tocarTexto(cx, cy){
  if (!LV || !LV.video.videoWidth) return; const v = LV.video, r = v.getBoundingClientRect(), m = mapaVideo();
  const vx = (cx - r.left - m.ox) / m.k, vy = (cy - r.top - m.oy) / m.k;
  const w = v.videoWidth * 0.5, h = v.videoHeight * 0.16; const x0 = Math.max(0, vx - w / 2), y0 = Math.max(0, vy - h / 2);
  const cv = document.createElement('canvas'); cv.width = Math.round(Math.min(w, v.videoWidth - x0)); cv.height = Math.round(Math.min(h, v.videoHeight - y0));
  cv.getContext('2d').drawImage(v, x0, y0, cv.width, cv.height, 0, 0, cv.width, cv.height);
  const mk = document.createElement('span'); mk.className = 'lv-tap'; mk.style.left = (cx - r.left) + 'px'; mk.style.top = (cy - r.top) + 'px'; LV.ov.appendChild(mk);

  if (!val && tessW){ try { const { data } = await tessW.recognize(cv, {}, { blocks:true, text:true }); const ws = palabrasOcr(data).filter(x => pareceCodigo(x.t)); const est = estilosSet();
      const cxv = cv.width / 2, cyv = cv.height / 2; const d = x => Math.hypot((x.b.x0 + x.b.x1) / 2 - cxv, (x.b.y0 + x.b.y1) / 2 - cyv);
      const hit = ws.find(x => est.has(x.t)) || ws.sort((a, b) => d(a) - d(b))[0]; if (hit) val = hit.t; } catch {} }
  if (!val && S.sample){ try { const blob = await cvBlob(cv, .9);
      const rr = await S.sample.json('Es un recorte de una foto de una etiqueta, caja o factura de ropa. Devuelve el código de estilo o modelo que se ve (letras y números, sin espacios). Responde solo JSON {"codigo":string o null}.', { images:[blob], modelTier:'quick' });
      if (rr && rr.codigo) val = String(rr.codigo).trim(); } catch {} }
  if (!LV) return; mk.remove();
  if (val){ cerrarVivo(); buscarCon(val, 'Texto leído'); } else if (st) st.textContent = 'No pude leer ese texto. Acércate un poco y toca otra vez.';
}

/* ---------- Reporte PDF completo (para ver sin internet) ---------- */
async function exportarReportePdf(){
  if (!window.jspdf){ toast('El generador de PDF no cargó. Vuelve a abrir la app con internet.'); return; }
  const arts = S.arts.filter(a => !a.ejemplo).slice().sort((x, y) => ((prov(x.proveedorId) || {}).nombre || '').localeCompare((prov(y.proveedorId) || {}).nombre || '') || String(x.estilo).localeCompare(String(y.estilo), undefined, { numeric:true }));
  if (!arts.length){ toast('No hay artículos'); return; }
  progStart('Creando reporte PDF', arts.length + 1, true);
  try {
    const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit:'mm', format:'a4' });
    const W = 210, H = 297, M = 12; const txt = s => String(s ?? '').replace(/→/g, '->').replace(/[★☆✓]/g, '');
    const img = async (f, max) => { try { const im = await loadImg(fotoUrl(f)); const cv = toCanvas(im, max); return { d:cv.toDataURL('image/jpeg', .78), w:cv.width, h:cv.height }; } catch { return null; } };
    const fit = (im, bx, by, bw, bh) => { doc.setFillColor(240,242,241); doc.rect(bx, by, bw, bh, 'F'); if (!im) return; const k = Math.min(bw / im.w, bh / im.h); const w = im.w * k, h = im.h * k; doc.addImage(im.d, 'JPEG', bx + (bw - w) / 2, by + (bh - h) / 2, w, h); };
    const fecha = new Date(); const fTxt = fecha.toLocaleDateString('es-EC', { day:'2-digit', month:'long', year:'numeric' });
    const conSt = arts.filter(tieneStock); const piezas = conSt.reduce((x, a) => x + totalStock(a), 0);
    const valC = conSt.reduce((x, a) => x + totalStock(a) * (cb(a) || 0), 0), valM = conSt.reduce((x, a) => x + totalStock(a) * (precio(a, 'mayoreo') || 0), 0);
    const provIds = uniq(arts.map(a => a.proveedorId || ''));
    // Portada
    doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(22,33,28); doc.text('Reporte de artículos', M, 26);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(100,110,105); doc.text(txt('Copia del ' + fTxt + ' · incluye costos (uso interno)'), M, 33);
    const box = (x, y, l, v) => { doc.setDrawColor(221,227,223); doc.roundedRect(x, y, 88, 18, 3, 3); doc.setFontSize(9); doc.setTextColor(100,110,105); doc.text(l, x + 4, y + 6.5); doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(22,33,28); doc.text(String(v), x + 4, y + 14); doc.setFont('helvetica', 'normal'); };
    box(M, 42, 'Artículos', arts.length); box(M + 94, 42, 'Piezas en bodega', piezas); box(M, 64, 'Valor a costo', money(valC)); box(M + 94, 64, 'Valor a mayoreo', money(valM));
    let y = 96; doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(22,33,28); doc.text('Por proveedor', M, y); y += 7;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    provIds.forEach(id => { const l = arts.filter(a => (a.proveedorId || '') === id); const p = prov(id); doc.text(txt(`${(p || {}).nombre || 'Sin proveedor'} · ${l.length} artículos · ${l.reduce((x, a) => x + totalStock(a), 0)} piezas`), M, y); y += 6; });
    // Artículos
    let n = 0;
    for (const id of provIds){
      const l = arts.filter(a => (a.proveedorId || '') === id); const p = prov(id);
      doc.addPage(); y = M + 4;
      doc.setFillColor(47,111,94); doc.rect(M, y - 5, W - 2 * M, 9, 'F'); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(255,255,255);
      doc.text(txt(`${(p || {}).nombre || 'Sin proveedor'} · ${l.length} artículos`), M + 3, y + 1.2); y += 9;
      for (const a of l){
        progStep(`Artículo ${++n} de ${arts.length}`, a.estilo);
        const { cols, tals } = ejes(a); const st = tieneStock(a); const filas = st ? cols.length + 2 : 1;
        const comp = compTexto(a); doc.setFontSize(9); const compL = comp ? doc.splitTextToSize(txt('Composición: ' + comp), W - 2 * M - 58) : [];
        const hTxt = 8 * 5.2 + compL.length * 4.4; const hFoto = (a.fotos || []).length > 1 ? 82 : 60; const hTab = st ? filas * 5.6 + 6 : 7;
        const hBlk = Math.max(hFoto, hTxt) + hTab + 6;
        if (y + hBlk > H - 12){ doc.addPage(); y = M + 2; }
        const fs = (a.fotos || []).slice(0, 3);
        const f0 = fs[0] ? await img(fs[0], 700) : null; fit(f0, M, y, 44, 58);
        for (let k = 1; k < fs.length; k++){ const fk = await img(fs[k], 360); fit(fk, M + (k - 1) * 23, y + 60, 21, 22); }
        const x = M + 50; let ty = y + 4;
        const pm = precio(a, 'mayoreo'), pn = precio(a, 'menudeo');
        doc.setFont('courier', 'bold'); doc.setFontSize(13); doc.setTextColor(22,33,28); doc.text(txt(a.estilo || ''), x, ty);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(txt(a.nombre || ''), x + doc.getTextWidth(String(a.estilo || '')) * 1.25 + 4, ty);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(47,111,94); doc.text(st ? totalStock(a) + ' pzs' : 'Sin existencia', W - M, ty, { align:'right' });
        ty += 6.5; doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(40,48,44);
        const linea = (k, v) => { doc.setFont('helvetica', 'bold'); doc.text(k, x, ty); doc.setFont('helvetica', 'normal'); doc.text(txt(v), x + 24, ty); ty += 5.2; };
        linea('Proveedor', `${(p || {}).nombre || '-'}${a.factura ? ' · factura ' + a.factura : ''}`);
        linea('Descripción', a.categoria || a.nombre || '-');
        linea('Colores', (a.colores || []).join(', ') || '-');
        linea('Tallas', (a.tallas || []).join(', ') || '-');
        linea('Costo', `${a.moneda === 'RMB' && a.costoOrigen != null ? '¥' + Number(a.costoOrigen).toFixed(2) + ' / ' + (a.tc || '?') + ' = ' : ''}${money(a.costo)}`);
        linea('Mayoreo', `${money(pm)}${pm != null && cb(a) ? '  (x' + fmtF(pm / cb(a)) + ')' : ''}`);
        linea('Menudeo', `${money(pn)}${pn != null && cb(a) ? '  (x' + fmtF(pn / cb(a)) + ')' : ''}`);
        linea('Origen', a.origen || '-');
        if (compL.length){ doc.setFontSize(9); doc.text(compL, x, ty); ty += compL.length * 4.4; }
        let yT = y + Math.max(hFoto, hTxt) + 2;
        if (st){
          const cw = Math.min(14, (W - 2 * M - 30) / (tals.length + 1)); doc.setFontSize(8.5);
          const row = (cells, bold, fill) => { if (fill){ doc.setFillColor(238,243,240); doc.rect(M, yT - 4, 30 + cw * cells.length - cw + cw, 5.6, 'F'); } doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(txt(cells[0]), M + 1, yT); cells.slice(1).forEach((c, i) => doc.text(String(c), M + 30 + cw * i + cw / 2, yT, { align:'center' })); yT += 5.6; };
          row(['Color \\ Talla', ...tals, 'Tot'], true, true);
          cols.forEach(c => { let rt = 0; const v = tals.map(t => { const q = +a.stock[skey(c, t)] || 0; rt += q; return q || '·'; }); row([c, ...v, rt], false); });
          row(['Total', ...tals.map(t => cols.reduce((x2, c) => x2 + (+a.stock[skey(c, t)] || 0), 0)), totalStock(a)], true, true);
        } else { doc.setFontSize(9); doc.setTextColor(120,128,124); doc.text('Sin existencia registrada', M, yT + 1); yT += 6; }
        doc.setDrawColor(221,227,223); doc.line(M, yT + 1, W - M, yT + 1); y = yT + 6;
        progDone();
      }
    }
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++){ doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120,128,124); doc.text(txt(`Reporte de artículos · ${fTxt}`), M, H - 6); doc.text(`Página ${i} de ${pages}`, W - M, H - 6, { align:'right' }); }
    const blob = doc.output('blob'); const name = `Reporte-articulos-${fecha.toISOString().slice(0, 10)}.pdf`;
    progDone(); progEnd();
    if (S.downloads) await S.downloads.save({ filename:name, data:blob });
    else { const u = URL.createObjectURL(blob); const el = document.createElement('a'); el.href = u; el.download = name; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
    toast(`Reporte listo · ${pages} páginas · ${pesoTxt(blob.size)}`);
  } catch (e) { progEnd(); if (e && e.code !== 'declined') toast('No se pudo crear el reporte: ' + (e.message || e)); }
}

function cargarScript(src){ return new Promise((ok, ko) => { if ([...document.scripts].some(x => x.src === src)) return ok(); const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => ko(new Error('No se pudo cargar ' + src)); document.head.appendChild(sc); }); }
async function miniFoto(f, cache){
  if (cache.has(f)) return cache.get(f);

}

/* ---------- respaldo .zip para la app del iPhone ----------
   Usa los datos que ya están en memoria (0 lecturas extra). Solo si el historial de

    </tbody></table>
    <div class="usoesp"><div class="row"><span>Datos (artículos, proveedores, movimientos, viajes)</span><b class="mono">≈ ${pesoTxt(datos)}</b></div>

      ${pct != null ? `<div class="usobar ${pct > 90 ? 'err' : pct > 75 ? 'warn' : ''}"><i style="width:${pct.toFixed(1)}%"></i></div><div class="small muted">${pct.toFixed(1)}% de ${pesoTxt(st.maxBytes)} disponibles para fotos</div>` : ''}
      <button class="btn block" data-act="usoesp" ${S.assets ? '' : 'disabled'}>${st ? 'Actualizar espacio' : 'Calcular espacio de fotos'}</button></div>
    <div class="small muted">Cuenta lo que hace <b>este dispositivo</b> desde el ${esc(u.desde || u.d)}. Cada dispositivo lleva su propia cuenta. La transferencia de fotos solo suma lo que se bajó de internet, no lo que ya estaba guardado en el navegador.</div>
  </div>`;
}
async function usoEspacio(){
  if (!S.assets) return; try { const r = await S.assets.list(); S.usoAssets = r.usage; usoAdd('l', 1); render(); } catch (e) { toast('No se pudo calcular: ' + (e.message || e)); }
}
/* ---------- Compras: pagado → en camino → contado en bodega ----------
   Una compra = lo pagado a un proveedor (factura). Guarda el tipo de cambio de
   su fecha. Mientras no se cuenta, sus piezas están "En camino" (no suman a la
   bodega). Al contar, lo recibido entra a bodega y lo que no cuadra queda como
   reclamo con el proveedor. */
const ESTADOS_RECLAMO = [['pendiente', 'Pendiente'], ['repuesto', 'Repuesto por el proveedor'], ['descontado', 'Descontado en otra compra'], ['perdido', 'Se pierde']];
const taraCaja = () => S.cfg.taraCajaLb != null && S.cfg.taraCajaLb !== '' ? +S.cfg.taraCajaLb : 2;
/* Peso de la caja vacía por sus medidas (pulgadas). Caja normal de solapas:
   cartón = (2·largo + 2·ancho + 1.5" de pestaña) × (alto + ancho). */
const CARTON_LB_FT2 = { simple:0.11, doble:0.18 };
const cartonLb = t => { const k = t === 'doble' ? 'cartonDobleLbFt2' : 'cartonSimpleLbFt2'; const v = S.cfg[k]; return v != null && v !== '' ? +v : CARTON_LB_FT2[t === 'doble' ? 'doble' : 'simple']; };
const TIPOS_BULTO = [['caja', 'Caja'], ['bulto', 'Bulto'], ['bolsa', 'Bolsa']];
const taraTipo = t => { const k = t === 'bolsa' ? 'taraBolsaLb' : 'taraBultoLb'; const v = S.cfg[k]; return v != null && v !== '' ? +v : t === 'bolsa' ? 0.1 : 0.5; };
function cajaVacia(b){ if (b.tipo === 'bolsa' || b.tipo === 'bulto') return taraTipo(b.tipo); const L = +b.l, W = +b.w, H = +b.h; if (!L || !W || !H) return null; return Math.round((2 * L + 2 * W + 1.5) * (H + W) / 144 * cartonLb(b.carton) * 1.03 * 100) / 100; }
const cajasDe = c => Array.isArray(c.cajasDet) ? c.cajasDet : [];
const compraUsd = (c, costo) => costo == null ? null : c.moneda === 'RMB' ? (+c.tc ? +costo / +c.tc : null) : +costo;
function compraTot(c){
  let pzs = 0, orig = 0, usd = 0, neto = 0, sinPeso = 0; const vistos = new Set();
  for (const l of c.lineas || []){ const q = Object.values(l.cant || {}).reduce((x, y) => x + (+y || 0), 0); if (!q) continue;
    pzs += q; orig += q * (+l.costo || 0); usd += q * (compraUsd(c, l.costo) || 0);
    const a = S.arts.find(x => x.id === l.artId); const lb = l.pesoLb != null ? +l.pesoLb : a && a.pesoLb != null ? +a.pesoLb : null;
    if (lb == null){ if (!vistos.has(l.artId)){ sinPeso++; vistos.add(l.artId); } } else neto += q * lb; }
  const det = cajasDe(c);
  let tara, emb, nCajas, sinMedidas = 0;
  let pesoPend = 0;
  if (det.length){ nCajas = det.length; pesoPend = det.filter(b => !+b.pesoLb).length; emb = det.reduce((x, b) => x + (+b.pesoLb || 0), 0);
    tara = det.reduce((x, b) => { const v = cajaVacia(b); if (v == null){ sinMedidas++; return x + taraCaja(); } return x + v; }, 0); }
  else { nCajas = +c.cajas || 0; emb = +c.pesoEmbLb || 0; tara = nCajas * taraCaja(); }
  return { pzs, orig, usd, neto, tara, sinPeso, emb, nCajas, sinMedidas, pesoPend, recibidoNeto:emb ? emb - tara : 0 };
}
function pesoEstado(c){
  const t = compraTot(c); if (!t.emb || !t.neto || t.pesoPend) return null;
  const dif = t.recibidoNeto - t.neto; const tol = Math.max(t.neto * 0.03, 0.5 * Math.max(1, t.nCajas));
  return { ...t, dif, tol, pct:dif / t.neto * 100, est:Math.abs(dif) <= tol ? 'ok' : dif < 0 ? 'falta' : 'sobra' };
}
const comprasCamino = () => (S.compras || []).filter(c => c.estado !== 'verificada');
/* Reparto de cada línea: lo que va en mi EQUIPAJE (solo si retiré yo) y lo que va por EMBARQUE. */
const qEq = (c, l, k) => c.entrega === 'retiro' ? Math.min(+(l.eq || {})[k] || 0, +(l.cant || {})[k] || 0) : 0;
const qEmb = (c, l, k) => Math.max(0, (+(l.cant || {})[k] || 0) - qEq(c, l, k));
const sumK = (c, l, f) => Object.keys(l.cant || {}).reduce((x, k) => x + f(c, l, k), 0);
const eqPend = c => c.estado !== 'verificada' && c.estadoEq !== 'contado';
const embPend = c => c.estado !== 'verificada' && c.estadoEmb !== 'contado';
/* Vía del embarque de cada compra: aéreo o marítimo (sin elegir: 📦). */
const VIAS = { aereo:['✈️', 'Aéreo'], maritimo:['🚢', 'Marítimo'] };
const icoVia = c => (VIAS[c && c.via] || ['📦'])[0];
const txtVia = c => VIAS[c && c.via] ? 'Embarque ' + VIAS[c.via][1].toLowerCase() : 'Embarque';
const icoVias = cs => { const v = uniq(cs.map(c => c.via || '')); return v.length === 1 ? icoVia(cs[0]) : '📦'; };

/* ---------- Lo importado de una factura va a "En camino", no a bodega ----------
   La factura dice lo que se compró, no lo que llegó. Por eso crea (o completa)
   una compra En camino; las piezas entran a bodega solo al contarlas. */
async function compraDesdeFactura(provId, factura, moneda, tc, items, llegada){ // items: [{a, lineas:[{color,talla,cant}], costo}]
  items = items.filter(x => x.lineas.length); if (!items.length) return null;
  const fac = String(factura || '').trim();
  let c = (S.compras || []).find(x => x.estado !== 'verificada' && x.proveedorId === provId && String(x.factura || '').trim() === fac); const nueva = !c;
  if (!c){ const base = nuevaCompra(provId); const mon = moneda ? (moneda === 'USD' ? 'USD' : 'RMB') : base.moneda; c = { ...base, proveedorId:provId, factura:fac, moneda:mon, tc:mon === 'RMB' ? (tc || base.tc || null) : null, origen:'importacion' }; } else c = JSON.parse(JSON.stringify(c));
  for (const it of items){
    let l = (c.lineas || []).find(x => x.artId === it.a.id);
    if (!l){ l = lineaDe(c, it.a); Object.keys(l.cant).forEach(k => { l.cant[k] = 0; }); c.lineas = [...(c.lineas || []), l]; }
    for (const x of it.lineas){ const k = skey(x.color, x.talla); l.cant[k] = (+l.cant[k] || 0) + x.cant; }
    if (it.costo != null && (!moneda || moneda === c.moneda)) l.costo = it.costo;
    if (llegada === 'maleta') l.eq = { ...l.cant };
  }
  if (nueva && S.importFecha) c.fecha = S.importFecha;
  if (nueva && S.importPagado && !c.pago) c.pago = 'pagado';
  if (llegada === 'maleta' || llegada === 'mixto') c.entrega = 'retiro';
  else if ((llegada === 'aereo' || llegada === 'maritimo') && nueva) c.entrega = 'embarcadora';
  if (llegada === 'aereo' || llegada === 'maritimo') c.via = llegada;
  await save('compras', c.id, c);
  return c;
}
/* Corrección: artículos cuya existencia se cargó desde la factura y que además
   están en una compra En camino (se contaban dos veces). */
const MOTIVOS_FACTURA = ['Importación de factura', 'Existencia inicial desde factura', 'Existencia inicial'];
function duplicadosCamino(){
  const out = [];
  for (const c of comprasCamino()) for (const l of c.lineas || []){
    const a = S.arts.find(x => x.id === l.artId); if (!a || !tieneStock(a)) continue;
    const movs = S.movs.filter(m => m.artId === a.id);
    if (movs.some(m => m.motivo === 'Compra contada' || m.motivo === 'Equipaje contado')) continue;
    const imp = movs.filter(m => m.tipo === 'entrada' && MOTIVOS_FACTURA.includes(m.motivo)); if (!imp.length) continue;
    const porK = {}; imp.forEach(m => (m.lineas || []).forEach(x => { const k = skey(x.color, x.talla); porK[k] = (porK[k] || 0) + (+x.cant || 0); }));
    const quitar = {}; let n = 0;
    Object.keys(porK).forEach(k => { const q = Math.min(porK[k], +(a.stock || {})[k] || 0, +(l.cant || {})[k] || porK[k]); if (q > 0){ quitar[k] = q; n += q; } });
    if (!n){ // la talla o el color se corrigieron después: se compara por el total
      let tope = Object.values(porK).reduce((x, y) => x + y, 0);
      Object.keys(a.stock || {}).forEach(k => { const q = Math.min(+a.stock[k] || 0, +(l.cant || {})[k] || 0, tope); if (q > 0){ quitar[k] = q; n += q; tope -= q; } }); }
    if (n && !out.some(x => x.a.id === a.id)) out.push({ a, quitar, n, c });
  }
  return out;
}
/* Existencia cargada al crear o importar artículos, nunca contada y que no está en ninguna compra: pasa a En camino. */
function sinContarSueltos(){
  const enCompra = new Set(); comprasCamino().forEach(c => (c.lineas || []).forEach(l => enCompra.add(l.artId)));
  const out = [];
  for (const a of S.arts){ if (a.ejemplo || !tieneStock(a) || enCompra.has(a.id)) continue;
    const movs = S.movs.filter(m => m.artId === a.id);
    if (movs.some(m => m.motivo === 'Compra contada' || m.motivo === 'Equipaje contado')) continue;
    const imp = movs.filter(m => m.tipo === 'entrada' && MOTIVOS_FACTURA.includes(m.motivo)); if (!imp.length) continue;
    const porK = {}; imp.forEach(m => (m.lineas || []).forEach(x => { const k = skey(x.color, x.talla); porK[k] = (porK[k] || 0) + (+x.cant || 0); }));
    const quitar = {}; let n = 0; Object.keys(porK).forEach(k => { const q = Math.min(porK[k], +(a.stock || {})[k] || 0); if (q > 0){ quitar[k] = q; n += q; } });
    if (!n){ let tope = Object.values(porK).reduce((x, y) => x + y, 0); Object.keys(a.stock || {}).forEach(k => { const q = Math.min(+a.stock[k] || 0, tope); if (q > 0){ quitar[k] = q; n += q; tope -= q; } }); }
    if (n) out.push({ a, quitar, n });
  }
  return out;
}
function vAvisoDuplicados(){
  const d = duplicadosCamino(), su = sinContarSueltos(); if (!d.length && !su.length) return '';
  if (!d.length){ const pzs = su.reduce((x, r) => x + r.n, 0);
    return `<div class="note small" style="background:var(--gold-soft);color:var(--ink);display:flex;flex-direction:column;gap:8px">
      <span><b style="color:var(--gold)">${su.length} ${su.length === 1 ? 'artículo tiene' : 'artículos tienen'} ${pzs} piezas en bodega que nunca se contaron</b> · se cargaron al crear o importar el artículo. Pásalas a <b>En camino</b> (se crea su compra por proveedor) y entrarán a bodega al contarlas. No se borra nada.</span>
      <button class="btn" data-act="corrdup" style="align-self:flex-start">Pasar a En camino</button></div>`; }

    <button class="btn danger" data-act="corrdup" style="align-self:flex-start">Corregir: dejarlas solo “en camino”</button></div>`;
}
async function corregirDuplicados(){
  const d = duplicadosCamino(), su = sinContarSueltos(); if (!d.length && !su.length) return;
  progStart('Corrigiendo existencias', d.length + su.length, true); let n = 0;
  try {
    for (const r of d){ progStep(`Artículo ${++n} de ${d.length}`, r.a.estilo);
      const lin = Object.entries(r.quitar).map(([k, q]) => ({ color:k.split('|')[0], talla:k.split('|')[1], cant:-q }));
      const st = await registrarMov(r.a.id, 'ajuste', lin, 'Corrección: estaba en camino, no en bodega', r.c.factura || '');
      const a2 = S.arts.find(x => x.id === r.a.id);
      if (a2 && st && !Object.values(st).some(q => +q > 0)) await save('articulos', a2.id, { ...a2, stock:{} });
      progDone(); }
    const grupos = new Map(); su.forEach(r => { const k = r.a.proveedorId + '|' + (r.a.factura || ''); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(r); });
    for (const lista of grupos.values()){ const a0 = lista[0].a; if (!a0.proveedorId) continue;
      await compraDesdeFactura(a0.proveedorId, a0.factura || '', a0.moneda === 'RMB' ? 'RMB' : a0.costo != null ? 'USD' : null, a0.tc || null, lista.map(r => ({ a:r.a, lineas:Object.entries(r.quitar).map(([k, q]) => ({ color:k.split('|')[0], talla:k.split('|')[1], cant:q })), costo:r.a.moneda === 'RMB' ? r.a.costoOrigen ?? null : r.a.costo ?? null })));
      for (const r of lista){ progStep(`Artículo ${++n} de ${d.length + su.length}`, r.a.estilo);
        const lin = Object.entries(r.quitar).map(([k, q]) => ({ color:k.split('|')[0], talla:k.split('|')[1], cant:-q }));
        const st = await registrarMov(r.a.id, 'ajuste', lin, 'Pasado a En camino: no se había contado', r.a.factura || '');
        const a2 = S.arts.find(x => x.id === r.a.id); if (a2) await save('articulos', a2.id, { ...a2, cantidad:a2.cantidad || r.n, ...(st && !Object.values(st).some(q => +q > 0) ? { stock:{} } : {}) });
        progDone(); } }
    progEnd(); toast(`Listo · ${d.length + su.length} ${d.length + su.length === 1 ? 'artículo' : 'artículos'}: ahora aparecen en camino; entran a bodega al contarlos`);
  } catch (e) { progEnd(); toast('No se pudo corregir: ' + (e.message || e)); }
}

/* ---------- Pago de la compra: pagada completa o solo abonada ---------- */
const fmtMon = (c, v) => (c.moneda === 'RMB' ? '¥' : '$') + (+v || 0).toFixed(2);
function pagoCompra(c){

async function pasarEquipaje(){
  const s = S.sheet; if (S.cBusy) return;
  const cs = comprasCamino().filter(c => (s.compraId ? c.id === s.compraId : (c.viajeId || '') === s.vid) && eqPend(c) && (c.lineas || []).some(l => sumK(c, l, qEq)));
  S.cBusy = true; render();
  try {
    let pzs = 0, cerradas = 0, falta = 0;
    for (const c0 of cs){ const ses = s.rec[c0.id]; if (!ses || !Object.values(ses).some(o => Object.values(o).some(q => +q > 0))) { falta += progresoConteo(c0, 'eq').falta; continue; }
      const c = JSON.parse(JSON.stringify(c0)); const rr = await registrarConteo(c, 'eq', ses); pzs += rr.pzs; falta += rr.falta || 0; if (rr.fin) cerradas++;

    S.cBusy = false; s.rec = {}; s.cqq = '';

    else { render(); toast(`Conteo guardado · ${pzs} pzs entraron a bodega · faltan ${falta}`); }
  } catch (e) { S.cBusy = false; render(); toast('No se pudo guardar el conteo: ' + (e.message || e)); }
}

async function excelCompra(compraId){
  const c = (S.compras || []).find(x => x.id === compraId); if (!c) return;
  const p = prov(c.proveedorId); const tc = +c.tc || null; const lista = []; let pzs = 0;
  for (const l of c.lineas || []){ const a = S.arts.find(x => x.id === l.artId) || { estilo:l.estilo, fotos:[] }; const st = {};
    for (const k of Object.keys(l.cant || {})){ const q = qEmb(c, l, k); if (q > 0){ st[k] = (st[k] || 0) + q; pzs += q; } }
    if (!Object.keys(st).length) continue;
    const v = Object.assign({}, a, { id:a.id || l.artId, estilo:l.estilo || a.estilo, proveedorId:c.proveedorId, factura:c.factura || a.factura || '', stock:st,
      colores:uniq(Object.keys(st).map(k => k.split('|')[0])), tallas:uniq(Object.keys(st).map(k => k.split('|')[1])).sort((x, y) => ordTalla(x) - ordTalla(y)) });

      if (c.moneda === 'RMB'){ v.moneda = 'RMB'; v.costoOrigen = co; v.tc = tc || a.tc || null; v.costo = v.tc ? Math.round(co / v.tc * 100) / 100 : a.costo; }
      else { v.moneda = 'USD'; v.costoOrigen = null; v.costo = co; } }
    lista.push(v); }

  lista.sort((x, y) => String(x.estilo).localeCompare(String(y.estilo), undefined, { numeric:true }));
  const hoy = new Date().toISOString().slice(0, 10);
  const nombre = `Lista-empaque-${(p && (inicialesProv(p.nombre) || limpioNom(p.nombre))) || 'Prov'}${c.factura ? '-F' + limpioNom(c.factura) : ''}-${hoy}.xlsx`;
  await exportarExcel(false, { lista, nombre, lbl:'Cantidad', toast:`Lista de empaque lista · ${pzs} pzs · ${lista.length} ${lista.length === 1 ? 'artículo' : 'artículos'}` });
}

async function guardarCompra(cerrar = true){
  const s = S.sheet; const c = s.c;
  if (!c.proveedorId){ toast('Elige el proveedor'); return false; }
  if (c.moneda === 'RMB' && !+c.tc){ toast('Escribe el tipo de cambio del día de la compra'); return false; }
  c.lineas = (c.lineas || []).filter(l => l.artId);
  try {
    await save('compras', c.id, c);
    // El peso por pieza escrito en la compra queda guardado en el artículo.
    for (const l of c.lineas){ const a = S.arts.find(x => x.id === l.artId); if (a && l.pesoLb != null && +l.pesoLb !== +a.pesoLb) await save('articulos', a.id, { ...a, pesoLb:+l.pesoLb }); }
    if (cerrar){ S.sheet = null; render(); toast('Compra guardada'); } else s.isNew = false;
    return true;
  } catch (e) { toast('No se pudo guardar: ' + (e.message || e)); return false; }
}
async function pasarABodega(){
  const s = S.sheet; const c = s.c; if (S.cBusy) return;
  const ses = s.ses || {}; if (!Object.values(ses).some(o => Object.values(o).some(q => +q > 0))){ toast('Escribe lo que encontraste en este conteo'); return; }

async function terminarConteo(tipo){
  const s = S.sheet; const c = s.c; if (S.cBusy) return;
  const pr = progresoConteo(c, tipo);
  if (pr.falta && s.confTerm !== tipo){ s.confTerm = tipo; render(); toast(`Faltan ${pr.falta} pzs: quedarán como faltante en el reclamo. Toca otra vez para confirmar.`); return; }
  s.confTerm = null;
  // Estilos donde faltan unas piezas y llegaron otras de más (otro color o talla): ¿cambio aceptado o reclamo?
  c.cambios = (c.cambios || []).filter(x => x.tipo !== tipo);
  for (const l of c.lineas || []){ const ks = clavesConteo(c, tipo, l); const fal = [], sob = [];
    ks.forEach(k => { const p = pedK(c, tipo, l, k), y = yaK(c, tipo, l.artId, k); if (y < p) fal.push({ k, q:p - y }); else if (y > p) sob.push({ k, q:y - p }); });
    if (!fal.length || !sob.length) continue;
    const txt = x => x.map(o => `${o.k.replace('|', ' ')} ×${o.q}`).join(', ');
    const dec = await elegirOpcion(`${l.estilo}: llegó otro color o talla`, `Faltan: ${txt(fal)}. Llegaron de más: ${txt(sob)}.`, [
      { v:'cambio', t:'Cambio aceptado', d:'No va al reclamo; queda anotado como cambio', pri:true }, { v:'reclamo', t:'Reclamo al proveedor', d:'Lo que falta y lo que sobra quedan en el reclamo' }], 'Cancelar');
    if (dec == null){ render(); return; }
    c.cambios.push({ tipo, artId:l.artId, estilo:l.estilo, falta:fal, sobra:sob, decision:dec, at:Date.now() }); }
  S.cBusy = true; render();
  try { const d = finalizarConteo(c, tipo); await save('compras', c.id, c); S.cBusy = false; if (tipo === 'emb') s.modo = null; render();
    toast(d.lista.length ? `Conteo terminado · faltan ${d.falta}${d.sobra ? ' y sobran ' + d.sobra : ''}: quedó el reclamo` : d.cambios.length ? 'Conteo terminado ✓ · cambios aceptados' : 'Conteo terminado ✓'); }
  catch (e) { S.cBusy = false; render(); toast('No se pudo terminar: ' + (e.message || e)); }
}
function historialCompras(artId){
  const out = [];
  for (const c of S.compras || []) for (const l of c.lineas || []) if (l.artId === artId){ const q = Object.values(l.cant || {}).reduce((x, y) => x + (+y || 0), 0); out.push({ c, l, q, usd:compraUsd(c, l.costo) }); }
  return out.sort((x, y) => String(y.c.fecha).localeCompare(String(x.c.fecha)));
}

const TAB_MEM = {};
function cambiarTab(t){

  if (t === S.tab && S.sheet){ return; }

/* ---------- Gesto de regresar: deslizar desde el borde izquierdo hacia la derecha ----------
   Cierra lo que esté encima (visor de documentos, foto ampliada u hoja abierta),
   igual que tocar la flecha de volver. La capa sigue al dedo mientras se desliza. */
(() => {
  const BORDE = 28, UMBRAL = 80; let g = null;
  const capa = () => document.querySelector('.dview') || document.querySelector('.lb') || [...document.querySelectorAll('.sheet')].pop() || null;
  const volver = () => { const b = document.querySelector('.dview [data-act="dvclose"]') || document.querySelector('.lb [data-act="lbclose"]') || [...document.querySelectorAll('.sheet .sh-bar .iconbtn')].pop(); if (b) b.click(); };
  document.addEventListener('touchstart', e => { const t = e.touches[0]; if (e.touches.length !== 1 || t.clientX > BORDE) { g = null; return; } const el = capa(); if (!el) { g = null; return; } g = { x:t.clientX, y:t.clientY, el, dx:0, activo:false }; }, { passive:true });
  document.addEventListener('touchmove', e => { if (!g) return; const t = e.touches[0]; const dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (!g.activo){ if (Math.abs(dy) > 12 && Math.abs(dy) > dx) { g = null; return; } if (dx > 10) { g.activo = true; g.el.style.transition = 'none'; } }
    if (g.activo){ g.dx = Math.max(0, dx); g.el.style.transform = `translateX(${g.dx}px)`; g.el.style.boxShadow = '-8px 0 24px rgba(0,0,0,.25)'; if (e.cancelable) e.preventDefault(); } }, { passive:false });
  const fin = () => { if (!g) return; const { el, dx, activo } = g; g = null; if (!activo) return;
    el.style.transition = 'transform .18s ease-out';
    if (dx > UMBRAL){ el.style.transform = `translateX(${window.innerWidth}px)`; setTimeout(() => { el.style.transform = ''; el.style.transition = ''; el.style.boxShadow = ''; volver(); }, 170); }
    else { el.style.transform = ''; setTimeout(() => { el.style.transition = ''; el.style.boxShadow = ''; }, 200); } };
  document.addEventListener('touchend', fin, { passive:true }); document.addEventListener('touchcancel', fin, { passive:true });
})();

async function importarRespaldo(file){

    if (!ok) return;

    progStart('Importando respaldo', total, true);

      try { const f = zip.file(ruta); if (f){ const b = new Blob([await f.async('arraybuffer')], { type:'image/jpeg' }); const up = await S.assets.upload(b); nuevaRef[ref] = 'asset:' + up.id; } } catch { fallos++; } progDone(); }
    const docAsset = {}; n = 0;
    for (const doc of docs){ progStep(`Facturas ${++n} de ${docs.length}`, doc.nombre || '');
      try { const f = docArch[doc.id] && zip.file(docArch[doc.id]); if (f){ const tipo = doc.tipo === 'img' ? 'image/jpeg' : 'application/pdf'; const up = await S.assets.upload(new Blob([await f.async('arraybuffer')], { type:tipo })); docAsset[doc.id] = up.id; } } catch { fallos++; } progDone(); }

    await guardar('proveedores', provs);

    await guardar('viajes', vjs);
    await guardar('compras', comps);
    await guardar('movimientos', movs);
    await guardar('documentos', docs.filter(x => docAsset[x.id]), x => ({ ...x, assetId:docAsset[x.id] }));
    progStep('Configuración', ''); if (d.config){ try { Object.assign(S.cfg, d.config); await saveCfg(); } catch { fallos++; } } progDone();
    progEnd(); render();
    toast(`Respaldo importado · ${arts.length} artículos · ${Object.keys(nuevaRef).length} fotos · ${Object.keys(docAsset).length} facturas${fallos ? ` · ${fallos} con error` : ''}`);
